spring.datasource.url = jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Optimización de memoria para Railway
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=60000

server.port=${PORT:8080}

# Google Geocoding API (Reverse Geocoding)
google.geocoding.api-key=${GOOGLE_GEOCODING_API_KEY:}

# Cloudinary frontend upload config
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.upload-preset=${CLOUDINARY_UPLOAD_PRESET:}
cloudinary.folder=${CLOUDINARY_FOLDER:}


